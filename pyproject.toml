[project]
name = "vital-mapper-backend"
version = "0.1.0"
description = "Vital Mapper - sprachgestuetzter Pflegedokumentationsassistent (Backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "PyJWT>=2.13.0",
    "cryptography>=42.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S = flake8-bandit (Security-Linting), B = bugbear, UP = pyupgrade
select = ["E", "F", "I", "UP", "B", "S"]
# B008: FastAPI verlangt Depends(...) als Default-Argument - Standardausnahme
# in jedem FastAPI-Projekt, kein Sicherheitsproblem.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest-Tests verwenden assert bewusst und korrekt.
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vital_mapper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
